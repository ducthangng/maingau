<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAINGAU Next Best Action</title>
    <!-- First paint, before the app's JavaScript and CSS arrive: the header and a page outline in the app's own
         shapes and colours (src/components/Layout.tsx, Skeleton.tsx). React replaces #root's content on its first render. -->
    <style>
      html { font-size: 15px; }
      body { margin: 0; background: #fafafa; color: #171717; font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      .boot-in { box-sizing: border-box; max-width: 1400px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
      @media (min-width: 640px) { .boot-in { padding-left: 1.5rem; padding-right: 1.5rem; } }
      .boot-head { border-bottom: 1px solid #e5e5e5; background: rgb(255 255 255 / 0.85); }
      .boot-head .boot-in { display: flex; align-items: center; gap: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .boot-brand { font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
      .boot-nav { display: flex; gap: 0.25rem; margin-left: 1rem; }
      .boot-main { display: grid; gap: 1.5rem; padding-top: 1.5rem; padding-bottom: 1.5rem; }
      .boot-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 1rem; overflow: hidden; }
      .boot-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; border-top: 1px solid #f5f5f5; }
      .boot-row:first-child { border-top: 0; }
      .b { display: block; height: 0.75rem; border-radius: 0.375rem; background-color: #e5e5e5;
           background-image: linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 0.55) 50%, transparent 65%);
           background-size: 250% 100%; background-attachment: fixed; animation: boot-sheen 1.6s ease-in-out infinite; }
      .b.soft { background-color: rgb(229 229 229 / 0.6); }
      .boot { animation: boot-in 280ms ease-out 150ms both; }
      @keyframes boot-sheen { from { background-position: 125% 0; } to { background-position: -25% 0; } }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .b { animation: none; background-image: none; } .boot { animation-duration: 1ms; } }
      @media (max-width: 639px) { .boot-hide-sm { display: none; } }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root">
      <div role="status" aria-busy="true">
        <span class="sr-only">Loading MAINGAU Next Best Action…</span>
        <header class="boot-head">
          <div class="boot-in">
            <span class="boot-brand">MAINGAU · Next Best Action</span>
            <span class="boot-nav boot boot-hide-sm" aria-hidden="true">
              <span class="b" style="height: 1.9rem; width: 5.5rem"></span>
              <span class="b soft" style="height: 1.9rem; width: 5rem"></span>
              <span class="b soft" style="height: 1.9rem; width: 4.5rem"></span>
            </span>
            <span class="b soft boot" style="margin-left: auto; width: 9rem" aria-hidden="true"></span>
          </div>
        </header>
        <main class="boot-in boot-main boot" aria-hidden="true">
          <div style="display: grid; gap: 0.6rem; max-width: 48rem">
            <span class="b" style="height: 1.75rem; width: 9rem"></span>
            <span class="b" style="height: 0.875rem; width: 100%"></span>
            <span class="b" style="height: 0.875rem; width: 70%"></span>
            <span class="b soft" style="width: 16rem"></span>
          </div>
          <div class="boot-card">
            <div class="boot-row"><span class="b soft" style="width: 1rem"></span><span class="b" style="height: 1rem; width: 38%"></span><span class="b soft boot-hide-sm" style="width: 3rem"></span><span class="b" style="width: 4rem; margin-left: auto"></span></div>
            <div class="boot-row"><span class="b soft" style="width: 1rem"></span><span class="b" style="height: 1rem; width: 30%"></span><span class="b soft boot-hide-sm" style="width: 3rem"></span><span class="b" style="width: 4rem; margin-left: auto"></span></div>
            <div class="boot-row"><span class="b soft" style="width: 1rem"></span><span class="b" style="height: 1rem; width: 42%"></span><span class="b soft boot-hide-sm" style="width: 3rem"></span><span class="b" style="width: 4rem; margin-left: auto"></span></div>
            <div class="boot-row"><span class="b soft" style="width: 1rem"></span><span class="b" style="height: 1rem; width: 26%"></span><span class="b soft boot-hide-sm" style="width: 3rem"></span><span class="b" style="width: 4rem; margin-left: auto"></span></div>
            <div class="boot-row"><span class="b soft" style="width: 1rem"></span><span class="b" style="height: 1rem; width: 34%"></span><span class="b soft boot-hide-sm" style="width: 3rem"></span><span class="b" style="width: 4rem; margin-left: auto"></span></div>
            <div class="boot-row"><span class="b soft" style="width: 1rem"></span><span class="b" style="height: 1rem; width: 22%"></span><span class="b soft boot-hide-sm" style="width: 3rem"></span><span class="b" style="width: 4rem; margin-left: auto"></span></div>
          </div>
        </main>
      </div>
    </div>
    <noscript>This dashboard needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
