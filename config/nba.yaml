# Agent NBA settings (README §6.5–§6.7, §10). Written into meta.versions.
value_model: clv_simple_v1
propensity_version: p-0.1
templates_version: t-0.1

p_mode: rate                       # rate | uplift (K1). rate is the default so MG-100023 can reach P-AS-01; uplift is reported too
n_min: 30                          # backoff threshold per level (spec C4)
rate_prior_strength: 30            # pseudo-count toward the global treated rate 69/2022
rate_prior_mean: 0.034             # README §6.6: rounded catalog rate used by the shrinkage formula
p_service_success: 0.5             # P-SV-01 assumption (K2)
generic_p_level: global            # generic offers use the catalog-wide average (D1)
# Q-NBA-10: keep unchecked legacy outcomes as observations; current consent is always gated separately.

# Calibration (whiteboard 27 Oct): per offer × channel × tone, k = buys observed / buys the model expected,
# pulled toward 1 by prior_buys pseudo-buys and kept within [min_k, max_k]; p_new = p × k.
# Not applied to catalog offers (D1: catalog average), the service assumption or reviewed overrides.
calibration: {active: true, prior_buys: 5, min_k: 0.2, max_k: 3.0}

confidence:
  high_min_n: 100
  medium_min_n: 30

send_time:
  email_hour: 10
  sms_hour: 18
  call_window: "10:00-16:00"

sensitivity_pct: 20

# Rule Center tier 2 (docs/rule-center.md §3), checked per offer × channel after valuation; service is exempt.
# B-02 (contact cap) is config/kg.yaml contact_cap and B-07 (never offer what they own) is a KG gate.
# Contact sources: nba_history | newsletter | service_feedback (nba.kg.contacts).
rule_set_version: rs-1
business_rules:
  B-01: {name: "Max {max} e-mails in {window_days} days", active: true, kind: channel_frequency, effect: DEFER_UNTIL,
         channels: [newsletter_email, email], max: 5, window_days: 90, sources: [nba_history, newsletter],
         reason: "E-mail paused: {count}/{max} e-mails in {window_days} days"}
  B-03: {name: "Max {max} call(s) in {window_days} days", active: true, kind: channel_frequency, effect: DEFER_UNTIL,
         channels: [outbound_call], max: 1, window_days: 90, sources: [nba_history, service_feedback],
         reason: "Phone paused: {count}/{max} calls in {window_days} days"}
  B-04: {name: "Max {max} SMS in {window_days} days", active: true, kind: channel_frequency, effect: DEFER_UNTIL,
         channels: [sms], max: 1, window_days: 90, sources: [nba_history],
         reason: "SMS paused: {count}/{max} SMS in {window_days} days"}
  B-05: {name: "Pause an offer {cooldown_days} days after {min_responses} dismissals", active: true, kind: offer_cooldown, effect: DEFER_UNTIL,
         responses: [dismissed, ignored], min_responses: 2, cooldown_days: 60,
         reason: "Offer paused: dismissed or ignored {count} times, last on {last}"}
  B-06: {name: "No sales {cooldown_days} days after a ticket", active: true, kind: post_ticket_cooldown, effect: DEFER_UNTIL,
         cooldown_days: 14, reason: "Sales paused: ticket {ticket} resolved on {resolved}"}
  B-08: {name: "Calls only if ΔCLV ≥ €{min_eur}", active: true, kind: min_delta_clv, effect: BLOCK_CHANNEL,
         min_eur: {outbound_call: 10}, reason: "{channel} needs ΔCLV ≥ €{min}; this one is €{value}"}
  B-09: {name: "Max {per_week} calls per week", active: true, kind: channel_capacity, effect: DEFER_UNTIL,
         per_week: {outbound_call: 50}, reason: "{channel} capacity full this week ({limit}); ranked {position} by ΔCLV"}
# Rules added by marketing (Rule Center page / POST /api/rules). Same shape as rules.json RuleNode with a condition.
custom_rules: []
